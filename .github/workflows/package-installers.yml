# Packages Flectar Mail into a native installer per platform:
#   - macOS: an ad-hoc-signed .dmg (Apple Silicon)
#   - Windows: an NSIS .exe installer (x64)
#
# Triggers on a tag push (v*) or manually. On a tag push the two artifacts are
# also attached to/created as a GitHub Release for that tag.

name: Package installers (DMG / EXE)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS DMG (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: package-macos-arm64

      - name: Build release binary
        env:
          FLECTAR_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.FLECTAR_GOOGLE_DESKTOP_CLIENT_ID }}
          FLECTAR_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.FLECTAR_GOOGLE_DESKTOP_CLIENT_SECRET }}
          FLECTAR_MICROSOFT_DESKTOP_CLIENT_ID: ${{ secrets.FLECTAR_MICROSOFT_DESKTOP_CLIENT_ID }}
        run: cargo build --locked --release --no-default-features --features remote-content --bin flectar-mail

      - name: Build app bundle and DMG
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/package-macos.sh
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          bundle="$PWD/target/macos/Flectar Mail.app"
          staging="$PWD/target/macos/dmg-staging"
          dmg="$PWD/target/macos/flectar-mail-${version}-arm64.dmg"
          rm -rf "$staging" "$dmg"
          mkdir -p "$staging"
          cp -R "$bundle" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create \
            -volname "Flectar Mail" \
            -srcfolder "$staging" \
            -ov \
            -format UDZO \
            "$dmg"
          printf 'Created %s\n' "$dmg"
          ls -la "$PWD/target/macos"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flectar-mail-macos-arm64-dmg
          path: target/macos/flectar-mail-*-arm64.dmg
          if-no-files-found: error

  windows:
    name: Windows installer (x64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: package-windows-x64

      - name: Build release binary
        shell: bash
        env:
          FLECTAR_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.FLECTAR_GOOGLE_DESKTOP_CLIENT_ID }}
          FLECTAR_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.FLECTAR_GOOGLE_DESKTOP_CLIENT_SECRET }}
          FLECTAR_MICROSOFT_DESKTOP_CLIENT_ID: ${{ secrets.FLECTAR_MICROSOFT_DESKTOP_CLIENT_ID }}
        run: cargo build --locked --release --no-default-features --features remote-content --bin flectar-mail

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          $nsis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $nsis) {
            $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          "NSIS_PATH=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage installer files and build EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = (Get-Location).Path

          # Read the package version (the only line-start "version = " in Cargo.toml).
          $version = [regex]::Match((Get-Content (Join-Path $repo 'Cargo.toml') -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value

          $exe = Join-Path $repo 'target\release\flectar-mail.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            Write-Error "Built binary not found at $exe"
            exit 1
          }

          $stage = Join-Path $repo 'target\installer'
          New-Item -ItemType Directory -Force $stage | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $stage 'LICENSES') | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $stage 'Licenses\Google Sans Flex') | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $stage 'Licenses\Noto Emoji') | Out-Null

          # Copy each file with an explicit destination filename so a failure is
          # loud and atomic (a directory-with-trailing-slash destination can fail
          # silently and leave makensis with nothing to install).
          Copy-Item -LiteralPath $exe -Destination (Join-Path $stage 'flectar-mail.exe')
          Copy-Item -LiteralPath (Join-Path $repo 'README.md') -Destination (Join-Path $stage 'README.md')
          Copy-Item -LiteralPath (Join-Path $repo 'LICENSE') -Destination (Join-Path $stage 'LICENSE')
          Copy-Item -LiteralPath (Join-Path $repo 'THIRD_PARTY_NOTICES.md') -Destination (Join-Path $stage 'THIRD_PARTY_NOTICES.md')
          Get-ChildItem -File (Join-Path $repo 'LICENSES') | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $stage 'LICENSES')
          }
          Copy-Item -LiteralPath (Join-Path $repo 'resources\fonts\google-sans-flex\OFL.txt') -Destination (Join-Path $stage 'Licenses\Google Sans Flex\OFL.txt')
          Copy-Item -LiteralPath (Join-Path $repo 'resources\fonts\google-sans-flex\README.md') -Destination (Join-Path $stage 'Licenses\Google Sans Flex\README.md')
          Copy-Item -LiteralPath (Join-Path $repo 'resources\fonts\noto-emoji\OFL.txt') -Destination (Join-Path $stage 'Licenses\Noto Emoji\OFL.txt')
          Copy-Item -LiteralPath (Join-Path $repo 'resources\fonts\noto-emoji\README.md') -Destination (Join-Path $stage 'Licenses\Noto Emoji\README.md')

          # Diagnostic: show the exact staged tree before invoking NSIS.
          "Staged tree:"
          Get-ChildItem -Recurse -File $stage | ForEach-Object { $_.FullName }

          # Convert to forward slashes so they survive makensis command-line defines.
          $stageFwd = $stage.Replace('\', '/')
          $iconFwd  = (Resolve-Path (Join-Path $repo 'platform\windows\flectar-mail.ico')).Path.Replace('\', '/')
          $outdirFwd= $stage.Replace('\', '/')   # EXE is written into the staging dir

          $out = & "$env:NSIS_PATH" "-DVERSION=$version" "-DSTAGE=$stageFwd" "-DICON=$iconFwd" "-DOUTDIR=$outdirFwd" "platform\windows\flectar-mail.nsi"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "makensis failed: $out"
          }

          Get-ChildItem "$stage\*.exe" | Select-Object -ExpandProperty FullName

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flectar-mail-windows-x64
          path: target/installer/flectar-mail-*-setup-x64.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download macOS DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flectar-mail-macos-arm64-dmg
          path: release-assets/macos

      - name: Download Windows EXE
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flectar-mail-windows-x64
          path: release-assets/windows

      # The existing native-platforms.yml also attaches artifacts to the same
      # v* tag, so publish idempotently: create the release if it does not exist,
      # otherwise just add/overwrite our assets. This avoids a race between the
      # two workflows both calling `gh release create`.
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          find release-assets -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp '{}' dist/ \;
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          sha256sum dist/* > dist/SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            # Create first; on any failure (e.g. it already exists), fall back
            # to uploading so the run never dies to a create/upload race.
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "Flectar Mail ${GITHUB_REF_NAME#v}" \
              --generate-notes || \
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          fi
